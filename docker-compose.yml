services:
  web:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgresql://saas:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/saas
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      APP_URL: ${APP_URL:?Set the application origin}
      DEMO_MODE: "false"
      PUBLIC_PORTFOLIO_URL: https://bububi.icu
      PUBLIC_CONTACT_EMAIL: work@bububi.icu
      PUBLIC_TELEGRAM_URL: https://t.me/o3amfeels
      PUBLIC_SOURCE_URL: ${PUBLIC_SOURCE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: saas
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d saas"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
